<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Metallbauer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gesellenprüfung Metallbauer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
</head>
<body>
<style>
/* Layout: App-Aufbau fürs Handy – ruhiger Kopf mit Logo-Kachel, eine Spalte mit Karten, feste Tab-Leiste unten (kein Hochscrollen zur Navigation) */
:root{
  --bg:#eef2f6; --surface:#ffffff; --sunk:#f5f7fa; --ink:#16202a; --muted:#61707d; --line:#dbe2e9;
  --steel:#1f4e79; --steel-2:#2b67a0; --steel-soft:#e3edf7; --on-steel:#ffffff; --spark:#f2a33a;
  --ok:#1b7d48; --ok-soft:#e1f3e8; --bad:#b4261d; --bad-soft:#fbe4e2;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 4px 14px rgba(22,32,42,.06);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#212b35; --surface:#2c3844; --sunk:#27323d; --ink:#eef2f5; --muted:#a9b6c1; --line:#3c4a57;
  --steel:#2b5a86; --steel-2:#8dbdeb; --steel-soft:#2f4862; --on-steel:#ffffff; --spark:#f2a33a;
  --ok:#66d69a; --ok-soft:#21422f; --bad:#f4938a; --bad-soft:#4b2a28; --shadow:0 1px 2px rgba(0,0,0,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#212b35; --surface:#2c3844; --sunk:#27323d; --ink:#eef2f5; --muted:#a9b6c1; --line:#3c4a57;
  --steel:#2b5a86; --steel-2:#8dbdeb; --steel-soft:#2f4862; --on-steel:#ffffff; --spark:#f2a33a;
  --ok:#66d69a; --ok-soft:#21422f; --bad:#f4938a; --bad-soft:#4b2a28; --shadow:0 1px 2px rgba(0,0,0,.18); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:700;line-height:1.1;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.inner{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf */
.top{padding-top:18px;padding-bottom:6px}
.top .inner{display:flex;align-items:center;gap:14px}
.logo{width:50px;height:50px;flex:none;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2f6aa3,#1b456d);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 8px rgba(0,0,0,.18)}
.top .grow{flex:1;min-width:0}
.eyebrow{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--spark)}
.top h1{font-size:32px;letter-spacing:.005em;line-height:1}
.themeBtn{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.subline{flex:1;margin-top:10px;padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.subline b{color:var(--ink);font-weight:600}

main{padding-top:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px}
.sec-h h2{font-size:22px}
.muted{color:var(--muted)} .small{font-size:14px}
p{margin:0}

/* Fortschritt */
.big{font-family:var(--f-disp);font-size:52px;font-weight:700;line-height:1}
.bar{height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:6px}
.bar.thin{height:5px;border:0;background:var(--line)}
.bar.steel>i{background:var(--steel-2)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--steel-2);color:#fff;border-radius:12px;padding:13px 18px;font-weight:600;font-size:17px;min-height:50px;width:100%}
:root[data-theme="dark"] .btn{color:#0d1a26}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0d1a26}}
.btn.ghost{background:var(--steel-soft);color:var(--steel-2)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns.one{grid-template-columns:1fr}

/* Listen */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
button.li:active{background:var(--sunk)}
.li .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.li .t{font-weight:600;line-height:1.25}
.li .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.badge{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.05em;padding:2px 6px;border-radius:5px;background:var(--steel-soft);color:var(--steel-2);flex:none}
.pct{font-family:var(--f-disp);font-size:19px;font-weight:700;min-width:44px;text-align:right}
.weight{font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--steel-2);min-width:62px;text-align:right}

/* Frage */
.qbar{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.back{display:flex;align-items:center;gap:2px;color:var(--steel-2);font-weight:600;padding:6px 4px 6px 0}
.qbar .sp{flex:1}
.qtext{font-size:20px;font-weight:600;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;line-height:1.4;width:100%}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--steel-2);background:var(--steel-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.expl{border-radius:12px;padding:13px 14px;background:var(--steel-soft);line-height:1.45}
.expl.ok{background:var(--ok-soft)} .expl.bad{background:var(--bad-soft)}
.expl b{display:block;font-family:var(--f-disp);font-size:20px;margin-bottom:2px}
.expl.ok b{color:var(--ok)} .expl.bad b{color:var(--bad)}
.timer{font-family:var(--f-mono);font-weight:600;color:var(--ink)} .timer.low{color:var(--bad)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--steel-2);border-color:var(--steel-2);color:#fff}
.ans{border-top:1px dashed var(--line);padding-top:12px;line-height:1.5}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:700;font-size:15px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
details summary{cursor:pointer;font-weight:600;color:var(--steel-2)}
details p{margin-top:8px}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .row{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--steel-2)}
.tab .dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-family:var(--f-mono);display:grid;place-items:center}
@media (prefers-reduced-motion:no-preference){.opt,.li,.chip{transition:background .12s,border-color .12s}}
</style>

<header class="top"><div class="inner">
  <div class="logo" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 100 100"><rect x="18" y="14" width="64" height="14" rx="2" fill="#f1f4f7"/><rect x="42" y="28" width="16" height="44" fill="#f1f4f7"/><rect x="18" y="72" width="64" height="14" rx="2" fill="#f1f4f7"/><path d="M26 52 L43 66 L76 34" fill="none" stroke="#f2a33a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="grow"><span class="eyebrow">Gesellenprüfung</span><h1>Metallbauer</h1></div>
  <button class="themeBtn" id="themeBtn" aria-label="Hell oder dunkel umschalten"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path id="themeIco" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
</div>
<div class="inner"><div class="subline"><span>Fachrichtung Konstruktionstechnik</span><span><b class="num" id="ringTxt">0 %</b> sicher</span></div></div>
</header>

<main class="inner"><div id="view" class="stack"><div class="card"><p class="muted">Fragen werden geladen …</p></div></div></main>

<nav class="tabs" aria-label="Bereiche"><div class="row">
  <button class="tab" data-go="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>Start</button>
  <button class="tab" data-go="lernen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>Lernen</button>
  <button class="tab" data-go="pruefung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Prüfung</button>
  <button class="tab" data-go="fehler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Fehler<span class="dot" id="errDot" hidden></span></button>
  <button class="tab" data-go="karten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.5A8 8 0 1 1 21 12z"/></svg>Gespräch</button>
</div></nav>

<script>
const CATS={
  W:{n:"Werkstofftechnik",b:"KT"},F:{n:"Fertigungsverfahren",b:"KT"},S:{n:"Schweißen & Fügen",b:"KT"},
  K:{n:"Korrosionsschutz",b:"KT"},B:{n:"Bauelemente & Normen",b:"KT"},M:{n:"Technische Mathematik",b:"KT"},
  Z:{n:"Technisches Zeichnen",b:"KT"},ST:{n:"Statik & Festigkeit",b:"KT"},
  E:{n:"Elektrotechnik",b:"FA"},SG:{n:"Steuerung, Tore, Pneumatik",b:"FA"},MI:{n:"Montage & Instandhaltung",b:"FA"},
  A:{n:"Arbeitsschutz, Umwelt, QM",b:"KT/FA"},WS:{n:"Wirtschafts- und Sozialkunde",b:"WISO"}
};
const EXAMS={
  KT:{n:"Konstruktionstechnik",cats:["W","F","S","K","B","M","Z","ST","A"],count:30,min:60},
  FA:{n:"Funktionsanalyse",cats:["E","SG","MI","A","M"],count:30,min:60},
  WS:{n:"Wirtschafts- und Sozialkunde",cats:["WS"],count:20,min:30}
};
const CHEV='<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>';
let Q=[],C=[],S={q:{},c:{}};
const KEY="mb-kt-gp-v1";
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign({q:{},c:{}},JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const st=i=>S.q[i]||{s:0,c:0,w:0,streak:0};
const known=i=>st(i).streak>=2;
const openErrors=()=>Q.map((_,i)=>i).filter(i=>st(i).w>0&&!known(i));
function record(i,ok){const o=st(i);o.s++;ok?(o.c++,o.streak++):(o.w++,o.streak=0);S.q[i]=o;save();header()}
function header(){
  const k=Q.filter((_,i)=>known(i)).length;const p=Q.length?Math.round(k/Q.length*100):0;
  $("#ringTxt").textContent=p+" %";
  const e=openErrors().length;const d=$("#errDot");d.hidden=!e;d.textContent=e>99?"99+":e;
}
function grade(p){
  if(p>=92)return["sehr gut",1];if(p>=81)return["gut",2];if(p>=67)return["befriedigend",3];
  if(p>=50)return["ausreichend",4];if(p>=30)return["mangelhaft",5];return["ungenügend",6];
}
const V=h=>{$("#view").innerHTML=h;window.scrollTo(0,0)};

/* ---------- Routing ---------- */
const VIEWS=["start","lernen","pruefung","fehler","karten"];
let timerId=null;
function go(v){
  if(!VIEWS.includes(v))v="start";
  if(timerId){clearInterval(timerId);timerId=null}
  document.onkeydown=null;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.go===v));
  ({start:viewStart,lernen:viewLernen,pruefung:viewPruefung,fehler:viewFehler,karten:viewKarten})[v]();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(location.hash.slice(1)===b.dataset.go)go(b.dataset.go);else location.hash=b.dataset.go});
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));

/* ---------- Bausteine ---------- */
function catStats(c){const ids=Q.map((q,i)=>q[0]===c?i:-1).filter(i=>i>=0);
  return{ids,n:ids.length,k:ids.filter(known).length,seen:ids.filter(i=>st(i).s>0).length}}
function catList(){
  return `<div class="list">${Object.keys(CATS).map(c=>{const s=catStats(c);const p=s.n?Math.round(s.k/s.n*100):0;
    return `<button class="li" data-cat="${c}"><div class="body"><span class="t">${CATS[c].n}</span>
      <div class="bar thin"><i style="width:${p}%"></i></div>
      <span class="meta"><span>${s.k} von ${s.n} sicher</span><span class="badge">${CATS[c].b}</span></span></div>
      <span class="pct num">${p}%</span>${CHEV}</button>`}).join("")}</div>`;
}
function bindCats(){document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>startLearn([b.dataset.cat]))}

/* ---------- Start ---------- */
function viewStart(){
  const k=Q.filter((_,i)=>known(i)).length,seen=Q.filter((_,i)=>st(i).s>0).length,p=Q.length?Math.round(k/Q.length*100):0;
  const err=openErrors().length;
  V(`
  <section class="card">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
      <div><p class="small muted">Sicher gelernt</p><div class="big num">${p}<span style="font-size:28px">%</span></div></div>
      <p class="small muted" style="text-align:right">${k} von ${Q.length} Fragen<br>${seen} schon gesehen</p>
    </div>
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="btns"><button class="btn" id="goAll">Weiterlernen</button><button class="btn ghost" id="goErr" ${err?"":"disabled"}>${err} Fehler</button></div>
  </section>

  <div class="sec-h"><h2>Themen</h2><span class="small muted">sicher = 2× in Folge richtig</span></div>
  ${catList()}

  <div class="sec-h"><h2>So läuft die Prüfung</h2></div>
  <div class="list">
    ${[["Teil 1 · Arbeitsauftrag","Werkstück bauen und prüfen, 7 h, Fachgespräch bis 15 min","30 %"],
       ["Teil 2 · Kundenauftrag","Konstruktion + Steuerungstechnik + Fachgespräch, 16 h","35 %"],
       ["Konstruktionstechnik","schriftlich, 2 h","12,5 %"],
       ["Funktionsanalyse","schriftlich, 2 h","12,5 %"],
       ["Wirtschafts- und Sozialkunde","schriftlich, 1 h","10 %"]]
      .map(r=>`<div class="li"><div class="body"><span class="t">${r[0]}</span><span class="small muted">${r[1]}</span></div><span class="weight num">${r[2]}</span></div>`).join("")}
  </div>
  <section class="card">
    <details><summary>Wann ist man durch?</summary>
      <p class="small">Gesamtergebnis mindestens ausreichend, Teil 2 mindestens ausreichend, Kundenauftrag mindestens ausreichend, mindestens zwei der drei schriftlichen Bereiche mindestens ausreichend und kein Bereich in Teil 2 ungenügend (§ 9 MetallbauAusbV).</p></details>
    <details><summary>Woher kommen die Fragen?</summary>
      <p class="small">Für diesen Beruf gibt es keinen öffentlichen Fragenkatalog. Die Fragen sind nach den Prüfungsanforderungen der Ausbildungsverordnung und den Lernfeldern zusammengestellt. In der echten Prüfung gibt es zusätzlich offene Aufgaben mit Tabellenbuch, also Mathe-Fragen erst auf Papier rechnen. Der Lernstand bleibt auf diesem Gerät gespeichert.</p></details>
  </section>`);
  bindCats();
  $("#goAll").onclick=()=>startLearn(Object.keys(CATS));
  $("#goErr").onclick=()=>{location.hash="fehler"};
}

/* ---------- Lernen ---------- */
function viewLernen(){
  V(`<div class="sec-h" style="margin-top:0"><h2>Was willst du lernen?</h2></div>
  <button class="btn" id="goAll">Alle Themen gemischt</button>
  ${catList()}
  <p class="small muted">Falsch beantwortete und neue Fragen kommen zuerst. Nach jeder Antwort siehst du die Erklärung.</p>`);
  bindCats();$("#goAll").onclick=()=>startLearn(Object.keys(CATS));
}
function orderForLearn(ids){
  const pri=i=>{const o=st(i);if(o.s===0)return 1;if(o.streak===0)return 0;if(o.streak===1)return 2;return 3};
  return shuffle(ids).sort((a,b)=>pri(a)-pri(b));
}
function startLearn(cats,idsOverride,title,backTo){
  const ids=idsOverride||Q.map((q,i)=>cats.includes(q[0])?i:-1).filter(i=>i>=0);
  const list=orderForLearn(ids);
  const name=title||(cats.length===1?CATS[cats[0]].n:"Alle Themen");
  const back=backTo||"lernen";
  let pos=0,right=0,done=0;
  const show=()=>{
    if(pos>=list.length){
      V(`<section class="card"><h2 style="font-size:28px">Runde geschafft</h2><p>${right} von ${done} richtig.</p>
      <div class="btns"><button class="btn" id="again">Noch eine Runde</button><button class="btn ghost" id="home">Zur Übersicht</button></div></section>`);
      $("#again").onclick=()=>startLearn(cats,idsOverride,title,backTo);$("#home").onclick=()=>{location.hash="start";go("start")};return;
    }
    const i=list[pos];
    renderQ(i,{back,label:name,count:`${pos+1}/${list.length}`,progress:pos/list.length,extra:done?`<span class="num">${right}/${done} ✓</span>`:"",
      onAnswer:ok=>{record(i,ok);done++;if(ok)right++},onNext:()=>{pos++;show()},immediate:true});
  };
  show();
}

/* Frage */
function renderQ(i,o){
  const q=Q[i];const order=shuffle([0,1,2,3]);const K="ABCD";
  V(`<div class="qbar"><button class="back" id="backBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>Zurück</button>
      <span class="sp"></span>${o.extra||""}<span class="num">${o.count}</span></div>
    <div class="bar thin steel"><i style="width:${(o.progress*100).toFixed(1)}%"></i></div>
    <section class="card">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="badge">${CATS[q[0]].b}</span><span class="small muted">${CATS[q[0]].n}</span></div>
      <p class="qtext">${esc(q[1])}</p>
    </section>
    <div class="opts">${order.map((a,k)=>`<button class="opt" data-a="${a}"><span class="k">${K[k]}</span><span>${esc(q[2][a])}</span></button>`).join("")}</div>
    <div id="after" class="stack"></div>`);
  $("#backBtn").onclick=()=>{if(o.onBack)o.onBack();else{location.hash=o.back;go(o.back)}};
  const opts=[...document.querySelectorAll(".opt")];
  let answered=false;
  const answer=a=>{
    if(answered)return;answered=true;const ok=a===0;o.onAnswer(ok);
    if(o.immediate){
      opts.forEach(b=>{b.disabled=true;const v=+b.dataset.a;if(v===0)b.classList.add("right");else if(v===a)b.classList.add("wrong")});
      $("#after").innerHTML=`<div class="expl ${ok?"ok":"bad"}"><b>${ok?"Richtig":"Leider falsch"}</b>${esc(q[3])}</div>
        <button class="btn" id="next">Weiter</button>`;
      $("#next").onclick=o.onNext;
      $("#next").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"end"});
    }else{
      opts.forEach(b=>{b.disabled=true;if(+b.dataset.a===a)b.classList.add("sel")});
      setTimeout(o.onNext,200);
    }
  };
  opts.forEach(b=>b.onclick=()=>answer(+b.dataset.a));
  document.onkeydown=e=>{
    if(!answered){const k="abcd1234".indexOf(e.key.toLowerCase());if(k>=0)answer(+opts[k%4].dataset.a)}
    else if(e.key==="Enter"&&$("#next")){e.preventDefault();$("#next").click()}
  };
  if(o.after)o.after();
}

/* ---------- Prüfung ---------- */
function viewPruefung(){
  V(`<div class="sec-h" style="margin-top:0"><h2>Prüfungssimulation</h2></div>
  <p class="small muted">Zufällige Fragen mit Zeitlimit. Die Auswertung kommt am Ende, mit Punkten und Note nach dem 100-Punkte-Schlüssel.</p>
  ${Object.entries(EXAMS).map(([k,e])=>`<section class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h3 style="font-size:22px">${e.n}</h3><span class="small muted num">${e.count} Fragen · ${e.min} min</span></div>
    <button class="btn" data-ex="${k}">Starten</button></section>`).join("")}
  <p class="small muted">Die echte Prüfung dauert 2 h (KT, FA) bzw. 1 h (WiSo) und enthält auch offene Rechen- und Beschreibungsaufgaben.</p>`);
  document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>startExam(b.dataset.ex));
}
function startExam(k){
  const e=EXAMS[k];
  const pool=Q.map((q,i)=>e.cats.includes(q[0])?i:-1).filter(i=>i>=0);
  const byCat={};shuffle(pool).forEach(i=>(byCat[Q[i][0]]=byCat[Q[i][0]]||[]).push(i));
  const sel=[];const cats=Object.keys(byCat);let c=0;
  while(sel.length<e.count&&cats.some(x=>byCat[x].length)){const x=cats[c++%cats.length];if(byCat[x].length)sel.push(byCat[x].pop())}
  const list=shuffle(sel);const ans={};let pos=0,finished=false;
  const end=Date.now()+e.min*60000;
  const tick=()=>{const t=Math.max(0,end-Date.now());const el=$("#tmr");
    if(el){const m=Math.floor(t/60000),s=Math.floor(t/1000)%60;el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",t<5*60000)}
    if(t<=0)finish()};
  const show=()=>{
    if(pos>=list.length)return finish();
    const i=list[pos];
    renderQ(i,{label:e.n,count:`${pos+1}/${list.length}`,progress:pos/list.length,extra:`<span class="timer" id="tmr"></span>`,
      onAnswer:ok=>{ans[i]=ok},onNext:()=>{pos++;show()},immediate:false,onBack:finish,
      after:()=>{$("#backBtn").lastChild.textContent="Abgeben";
        $("#after").innerHTML=`<button class="btn ghost" id="skip">Später beantworten</button>`;
        $("#skip").onclick=()=>{list.push(list.splice(pos,1)[0]);show()}}});
    tick();
  };
  const finish=()=>{
    if(finished)return;finished=true;clearInterval(timerId);timerId=null;document.onkeydown=null;
    list.forEach(i=>record(i,!!ans[i]));
    const right=list.filter(i=>ans[i]).length;const p=Math.round(right/list.length*100);const [g,n]=grade(p);
    const wrong=list.filter(i=>!ans[i]);
    V(`<section class="card"><p class="small muted">${e.n}</p>
      <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap"><span class="big num">${p}</span><span class="muted" style="padding-bottom:6px">von 100 Punkten</span></div>
      <div><span class="pill ${n<=4?"ok":"bad"}">Note ${n} · ${g}</span></div>
      <p class="small muted">${right} von ${list.length} richtig. Ausreichend ab 50 Punkten.</p>
      <div class="btns ${wrong.length?"":"one"}"><button class="btn" id="re">Neue Simulation</button>${wrong.length?`<button class="btn ghost" id="learnW">Fehler lernen</button>`:""}</div></section>
      ${wrong.length?`<div class="sec-h"><h2>Falsch oder offen</h2><span class="small muted num">${wrong.length}</span></div>`+wrong.map(i=>`<section class="card"><p style="font-weight:600">${esc(Q[i][1])}</p><div class="expl ok"><b>${esc(Q[i][2][0])}</b>${esc(Q[i][3])}</div></section>`).join(""):""}`);
    $("#re").onclick=()=>viewPruefung();
    if(wrong.length)$("#learnW").onclick=()=>startLearn([],wrong,"Fehler aus der Simulation","pruefung");
  };
  timerId=setInterval(tick,1000);show();
}

/* ---------- Fehler ---------- */
function viewFehler(){
  const ids=openErrors();
  if(!ids.length){V(`<section class="card"><h2 style="font-size:26px">Keine offenen Fehler</h2><p class="muted">Falsch beantwortete Fragen landen hier, bis du sie zweimal hintereinander richtig hast.</p><button class="btn" id="l">Lernen</button></section>`);$("#l").onclick=()=>{location.hash="lernen"};return}
  const by={};ids.forEach(i=>by[Q[i][0]]=(by[Q[i][0]]||0)+1);
  V(`<section class="card"><p class="small muted">Offene Fehler</p><div class="big num">${ids.length}</div>
    <button class="btn" id="go">Alle wiederholen</button></section>
    <div class="sec-h"><h2>Nach Thema</h2></div>
    <div class="list">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<button class="li" data-ec="${c}"><div class="body"><span class="t">${CATS[c].n}</span></div><span class="pct num">${n}</span>${CHEV}</button>`).join("")}</div>`);
  $("#go").onclick=()=>startLearn([],ids,"Fehlertraining","fehler");
  document.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>startLearn([],ids.filter(i=>Q[i][0]===b.dataset.ec),"Fehler: "+CATS[b.dataset.ec].n,"fehler"));
}

/* ---------- Fachgespräch ---------- */
function viewKarten(){
  const groups=["Alle",...new Set(C.map(c=>c[0]))];let g="Alle",list=[],pos=0;
  const build=()=>{list=shuffle(C.map((c,i)=>i).filter(i=>g==="Alle"||C[i][0]===g)).sort((a,b)=>(S.c[a]?1:0)-(S.c[b]?1:0));pos=0;show()};
  const show=()=>{
    const knownN=list.filter(i=>S.c[i]).length;
    if(pos>=list.length){$("#cardArea").innerHTML=`<section class="card"><h3 style="font-size:24px">Stapel durch</h3><p>${knownN} von ${list.length} Karten kannst du sicher erklären.</p><button class="btn" id="rs">Neu mischen</button></section>`;$("#rs").onclick=build;return}
    const i=list[pos],c=C[i];
    $("#cardArea").innerHTML=`<div class="qbar"><span>${esc(c[0])}</span><span class="sp"></span><span class="num">${knownN} sicher · ${pos+1}/${list.length}</span></div>
      <section class="card"><p class="qtext">${esc(c[1])}</p>
      <p class="small muted">Erst laut antworten, als säße der Prüfer vor dir. Dann aufdecken.</p>
      <div id="ans"><button class="btn" id="rev">Antwort zeigen</button></div></section>`;
    $("#rev").onclick=()=>{$("#ans").innerHTML=`<div class="ans">${esc(c[2])}</div>
      <div class="btns" style="margin-top:12px"><button class="btn" id="ok">Konnte ich</button><button class="btn ghost" id="no">Nochmal üben</button></div>`;
      $("#ok").onclick=()=>{S.c[i]=1;save();pos++;show()};$("#no").onclick=()=>{delete S.c[i];save();pos++;show()}};
  };
  V(`<div class="sec-h" style="margin-top:0"><h2>Fachgespräch üben</h2></div>
    <p class="small muted">Im Kundenauftrag zählt das Fachgespräch 30 %. Die Karten trainieren typische Prüferfragen.</p>
    <div class="chips">${groups.map(x=>`<button class="chip" data-g="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <div id="cardArea" class="stack"></div>`);
  const mark=()=>document.querySelectorAll("[data-g]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===g));
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{g=b.dataset.g;mark();build()});
  mark();build();
}

/* ---------- Hell/Dunkel (Standard: dunkel) ---------- */
const MOON="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z",SUN="M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z";
function setTheme(t){document.documentElement.setAttribute("data-theme",t);$("#themeIco").setAttribute("d",t==="dark"?SUN:MOON);try{localStorage.setItem("mb-theme",t)}catch(e){}}
let theme="dark";try{theme=localStorage.getItem("mb-theme")||"dark"}catch(e){}
setTheme(theme);
$("#themeBtn").onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
